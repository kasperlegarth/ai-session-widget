<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Claude &amp; Codex Sessions</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div id="resize-handles">
      <div class="resize-handle n" data-direction="North"></div>
      <div class="resize-handle s" data-direction="South"></div>
      <div class="resize-handle e" data-direction="East"></div>
      <div class="resize-handle w" data-direction="West"></div>
      <div class="resize-handle ne" data-direction="NorthEast"></div>
      <div class="resize-handle nw" data-direction="NorthWest"></div>
      <div class="resize-handle se" data-direction="SouthEast"></div>
      <div class="resize-handle sw" data-direction="SouthWest"></div>
    </div>
    <div id="app">
      <div id="drag-region" data-tauri-drag-region></div>
      <ul id="session-list"></ul>
      <div id="context-menu" class="context-menu" hidden>
        <div class="context-menu-item" id="menu-always-on-top">
          <span class="menu-check">✓</span>
          <span>Always on top</span>
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-label">Size</div>
        <div class="context-menu-item" id="menu-size-auto" data-size-value="auto">
          <span class="menu-check">✓</span>
          <span>Auto size</span>
        </div>
        <div class="context-menu-item" id="menu-size-manual" data-size-value="manual">
          <span class="menu-check">✓</span>
          <span>Manual size</span>
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-label">Theme</div>
        <div class="context-menu-item" id="menu-theme-light" data-theme-value="light">
          <span class="menu-check">✓</span>
          <span>Light</span>
        </div>
        <div class="context-menu-item" id="menu-theme-dark" data-theme-value="dark">
          <span class="menu-check">✓</span>
          <span>Dark</span>
        </div>
        <div class="context-menu-item" id="menu-theme-system" data-theme-value="system">
          <span class="menu-check">✓</span>
          <span>System</span>
        </div>
        <div class="context-menu-separator"></div>
        <div class="context-menu-item" id="menu-refresh">Refresh</div>
        <div class="context-menu-item" id="menu-close">Close</div>
      </div>
    </div>
    <script type="module" src="./main.ts"></script>
  </body>
</html>

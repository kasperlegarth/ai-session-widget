[package]
name = "session-widget"
version = "0.4.0"
description = "AI Code Session Widget (fork of AI Session Widget) — running Claude Code and Codex sessions at a glance"
authors = ["Kasper Legarth", "Michael Goldschmidt"]
license = "MIT"
repository = "https://github.com/migoldschmidt/ai-code-session-widget"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "session_widget_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# tray-icon: status icon in the notification area (src/tray.ts)
# ~2.12 = same minor as @tauri-apps/api/cli in package.json; `tauri build`
# refuses mismatched minors. Raise both together (docs/fork/README.md).
tauri = { version = "~2.12", features = ["tray-icon"] }
# fork: a second start shows the running widget instead of opening another one
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.32"
dirs = "5"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_System_RestartManager",
    "Win32_UI_Accessibility",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    # fork: IShellLinkW for the autostart shortcut, ShellExecuteW for the deep link
    "Win32_UI_Shell",
    # fork: GetAsyncKeyState, end of a drag of the pinned widget (desktop.rs)
    "Win32_UI_Input_KeyboardAndMouse",
] }

[dev-dependencies]
tempfile = "3"

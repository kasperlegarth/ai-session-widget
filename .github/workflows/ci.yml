name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # windows-latest, not ubuntu — the crate depends on the `windows` crate
    # (Win32 focus/highlight APIs) and won't compile on Linux.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: cargo test

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsc --noEmit

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Checkout and tests only; nothing is written back (CodeQL
# actions/missing-workflow-permissions).
permissions:
  contents: read

jobs:
  rust:
    # windows-latest, not ubuntu — the crate depends on the `windows` crate
    # (Win32 focus/highlight APIs) and won't compile on Linux.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      # --locked: fail instead of silently updating Cargo.lock (e.g. a newer tauri)
      - run: cargo test --locked

  frontend:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          # 22.18+ runs the TypeScript unit tests directly (built-in type stripping)
          node-version: 22
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test

name: Secret scan

# Runs on every push to any branch and on pull requests, for everyone who
# clones the repo — nothing to set up locally. Scans the whole history with
# gitleaks and fails the run on a finding. (GitHub's push protection also
# blocks known token formats before a push is accepted; this catches the
# rest, after the push.)

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    env:
      # Pinned; raise together with the local version (`gitleaks version`).
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # whole history, not just the last commit
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks version
      - name: Scan
        # --redact: findings show the rule and location, never the secret
        run: ./gitleaks git . --redact --verbose --exit-code 1
